# Copy this file to `config.toml` and edit it. `config.toml` is gitignored,
# since it holds machine-specific paths.

# Global settings go here. Any key other than `directories` is available to
# the scanner via `Config::global_setting`.

# How often to run a scan, in hours.
scan_interval_hours = 24

# Where the generated SBOMs are written, relative to this file's directory.
output_dir = "sbom-out"

# Generate and use a CycloneDX VEX for each project. The first scan writes
# it next to the SBOM; later scans hand it back to cve-bin-tool so triage
# decisions are kept, and replace it with a refreshed copy.
vex = true

# The OSV ecosystems cve-bin-tool should download vulnerability data for, e.g.
# `["npm"]` or `["npm", "PyPI", "crates.io"]`. Leaving this out downloads every
# OSV ecosystem, as cve-bin-tool does by default.
#
# After generating an SBOM the scanner checks the ecosystems of its packages
# against this list. A package from an ecosystem that is not listed would be
# scanned without its OSV advisories, so the scan fails and names the
# ecosystem rather than reporting incomplete findings.
# osv_ecosystems = ["npm"]

# How old a cve-bin-tool data source's data may be before the scanner
# reports the source as stale. cve-bin-tool downloads its data daily, so a
# week is a long time for a source to go without an update.
cve_data_stale_days = 7

# Where cve-bin-tool keeps the vulnerability database it scans against.
# It defaults to `~/.cache/cve-bin-tool`, or wherever `XDG_CACHE_HOME`
# points.
# cve_bin_tool_cache_dir = "~/.cache/cve-bin-tool"

# Email alerts. A scan emails its report when it finishes, but only when
# `email_to`, `email_from` and `smtp_host` are all set and `email` is not
# false. Leave the keys out and scans run silently as before.
#
# `email_from` may carry a display name. Gmail only accepts the account you
# authenticate as (or an alias verified for it), so keep it equal to
# `smtp_user` unless you have set up an alias.
# email_to = ["you@gmail.com", "other@example.com"]
# email_from = "Security Scan <you@gmail.com>"

# Gmail SMTP. Use an App Password, which needs 2FA on the Google account;
# your normal account password will not work.
#
# The config file holds that password, so keep it private:
#
#     chmod 600 config.toml
#
# The scanner warns at startup when the file is readable by group or others.
# smtp_host = "smtp.gmail.com"
# smtp_port = 587
# smtp_user = "you@gmail.com"
# smtp_password = "xxxx xxxx xxxx xxxx"

# Optional. Inferred from the port when omitted: 587 uses STARTTLS, 465 uses
# implicit TLS. `none` sends no TLS and is only for a local test relay such
# as Mailpit (`smtp_host = "127.0.0.1"`, `smtp_port = 1025`). Authentication
# is skipped when `smtp_user` is unset.
# smtp_tls = "starttls"

# Master switch for email alerts. `--no-email` turns them off for one run.
# email = true

# Directories to scan. `path` is resolved relative to this file's directory
# unless it is absolute; a leading `~` expands to your home directory.
# `type` describes the kind of project held in the directory, and is the
# project type cdxgen is asked to scan for.
# `name` is optional and names the project in its SBOM; it defaults to the
# name of the directory.
# `vendor` is optional and names the supplier of the project; it is passed
# to cve-bin-tool when the SBOM is scanned for vulnerabilities.

[[directories]]
path = "~/projects/example-rust"
type = "rust"

[[directories]]
path = "~/projects/example-python"
type = "python"
name = "example-python"
vendor = "example-vendor"
